name: Temporary Actions artifact cleanup

on:
  push:
    branches:
      - ops/cleanup-actions-artifacts-2026-11-17
    paths:
      - .github/workflows/cleanup-artifacts.yml

permissions:
  actions: write

concurrency:
  group: temporary-actions-artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete stored workflow artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Snapshot and delete repository artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          set -Eeuo pipefail

          ids_file="$(mktemp)"
          trap 'rm -f "$ids_file"' EXIT

          round=1
          total_deleted=0
          total_bytes=0

          while (( round <= 5 )); do
            : > "$ids_file"
            page=1
            round_bytes=0

            # Snapshot every ID before deleting: deleting while paginating can
            # shift page boundaries and cause artifacts to be skipped.
            while :; do
              response="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/artifacts?per_page=100&page=${page}")"

              page_count="$(jq '.artifacts | length' <<< "$response")"
              jq -r '.artifacts[].id' <<< "$response" >> "$ids_file"
              page_bytes="$(jq '[.artifacts[].size_in_bytes] | add // 0' <<< "$response")"
              round_bytes=$((round_bytes + page_bytes))

              if (( page_count < 100 )); then
                break
              fi
              page=$((page + 1))
            done

            round_count="$(wc -l < "$ids_file" | tr -d ' ')"
            echo "Cleanup pass $round: found $round_count artifacts ($round_bytes bytes)."

            if (( round_count == 0 )); then
              break
            fi

            deleted=0
            missing=0
            failed=0

            while IFS= read -r artifact_id; do
              [[ -n "$artifact_id" ]] || continue

              status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --retry 4 --retry-all-errors --retry-delay 2 \
                --request DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/artifacts/${artifact_id}")" || status="000"

              case "$status" in
                204) deleted=$((deleted + 1)) ;;
                404) missing=$((missing + 1)) ;;
                *)
                  echo "::error::Could not delete artifact ${artifact_id}; HTTP status ${status}."
                  failed=$((failed + 1))
                  ;;
              esac
            done < "$ids_file"

            total_deleted=$((total_deleted + deleted))
            total_bytes=$((total_bytes + round_bytes))
            echo "Pass $round: deleted $deleted; already absent $missing; failed $failed."

            if (( failed > 0 )); then
              echo "::error::Stopping because one or more artifact deletions failed."
              exit 1
            fi

            remaining_response="$(curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GH_API_URL}/repos/${GH_REPOSITORY}/actions/artifacts?per_page=1&page=1")"
            remaining="$(jq '.total_count // 0' <<< "$remaining_response")"
            echo "Artifacts remaining after pass $round: $remaining."

            if (( remaining == 0 )); then
              break
            fi

            round=$((round + 1))
          done

          if (( round > 5 )); then
            echo "::error::Artifacts remain after five cleanup passes."
            exit 1
          fi

          echo "Cleanup complete. Deleted $total_deleted artifacts."
          echo "Approximate artifact payload removed: $total_bytes bytes."
